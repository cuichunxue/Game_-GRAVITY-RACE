<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GRAVITY RACE</title>
<meta name="description" content="3本のピンで坂を作って、3秒の玉転がしレース。最速の道はどっち？">
<meta name="theme-color" content="#e8edef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111920" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="GRAVITY RACE">
<meta property="og:description" content="最速の道はどっち？ リンクから同じコースで対戦">
<meta property="og:image" content="assets/share-card.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one portrait column like a handheld console - stage selector, race stage, control dock, result card */
:root{
  --paper:#e8edef; --stage:#dde5e8; --ink:#1d2a33; --muted:#5b6b76; --line:#c3cfd5; --panel:#f6f9fa;
  --wood:#c98b4a; --wood-dark:#8a5629; --steel:#d5dde2; --mint:#22997c; --mint-ink:#ffffff;
  --cobalt:#2f5bd3; --alert:#cf4334; --gate:#d79b00; --friend:#8a4fd0;
  --f-display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-num:'DM Mono',ui-monospace,'SFMono-Regular',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111920; --stage:#0c1318; --ink:#e4ebef; --muted:#93a4af; --line:#2a3944; --panel:#18232c;
  --wood:#d79a58; --wood-dark:#7b4b22; --steel:#c6d0d6; --mint:#3fc6a2; --mint-ink:#062019;
  --cobalt:#7397ff; --alert:#ff6a59; --gate:#f2c14e; --friend:#c49bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111920; --stage:#0c1318; --ink:#e4ebef; --muted:#93a4af; --line:#2a3944; --panel:#18232c;
  --wood:#d79a58; --wood-dark:#7b4b22; --steel:#c6d0d6; --mint:#3fc6a2; --mint-ink:#062019;
  --cobalt:#7397ff; --alert:#ff6a59; --gate:#f2c14e; --friend:#c49bff; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;
  padding:max(12px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ic{width:1.15em;height:1.15em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;margin:0;font-family:var(--f-display);font-size:1.15rem;letter-spacing:.04em}
.brand img{width:30px;height:30px;border-radius:8px}
.brand span{color:var(--mint)}
.tag{font-size:.72rem;color:var(--muted)}
.icon-btn{display:inline-flex;align-items:center;gap:6px;font:500 .78rem var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.icon-btn[aria-pressed="false"]{color:var(--muted)}
.levels{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font:500 .78rem var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.lv[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lv:disabled{opacity:.45;cursor:not-allowed}
.lv:focus-visible,.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.head h1{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:4px}
.meta b{color:var(--ink);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.wrap{position:relative;border-radius:14px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
canvas{display:block;width:100%;height:clamp(300px,54vh,500px);touch-action:none;cursor:grab}
.clock{position:absolute;left:12px;top:10px;font-family:var(--f-num);font-weight:500;font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock small{font-size:.7rem;color:var(--muted);margin-left:2px}
.speed{position:absolute;left:14px;top:46px;font-family:var(--f-num);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.slow{position:absolute;left:14px;top:70px;font:700 .7rem var(--f-body);letter-spacing:.12em;color:var(--alert)}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:4.5rem;color:var(--ink);pointer-events:none;text-shadow:0 2px 0 var(--stage)}
.count.go{color:var(--mint)}
.wrap.scenic :is(.clock,.clock small,.speed,.tip,.count){color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.tip{position:absolute;left:12px;bottom:10px;right:12px;font-size:.78rem;color:var(--muted);pointer-events:none}
.guide{position:absolute;width:72px;height:102px;pointer-events:none;margin:-16px 0 0 -24px;animation:drag 1.8s ease-in-out infinite}
.guide img{width:100%;height:100%}
@keyframes drag{0%,15%{transform:translateY(0);opacity:0}25%{opacity:1}70%{transform:translateY(46px);opacity:1}90%,100%{transform:translateY(46px);opacity:0}}
.dock{display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;font:700 1rem var(--f-body);border-radius:12px;padding:14px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn.go{background:var(--mint);border-color:var(--mint);color:var(--mint-ink);flex:2}
.btn.alt{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card .verdict{font-family:var(--f-display);font-size:1.3rem;margin:0}
.card .verdict.win{color:var(--mint)} .card .verdict.lose{color:var(--alert)}
.times{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:.88rem}
.times span:nth-child(even){font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.why{font-size:.88rem;line-height:1.65;margin:0;max-width:62ch}
.why b{color:var(--ink)}
.label{font-size:.68rem;letter-spacing:.14em;color:var(--muted);font-weight:700;margin:0}
pre.share{font-family:var(--f-num);font-size:.85rem;background:var(--stage);border-radius:10px;padding:10px 12px;margin:0;white-space:pre-wrap;word-break:break-all;user-select:all}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{padding:10px;font-size:.9rem}
.explain{display:block;width:100%;max-width:360px;height:auto;border-radius:12px}
.notice{font-size:.8rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){.guide{animation:none;opacity:1}}
</style>
</head>
<body>
<!-- I-05 UI icons (asset pack paths; mute/next/image drawn to match). Inline + currentColor so they follow the theme and work from file:// -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5 L19 12 L8 19 Z" fill="currentColor"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M20 7 V3 L16 7 L20 11 M20 7 A9 9 0 1 0 21 15"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 16 V3 M7 8 L12 3 L17 8 M5 14 V21 H19 V14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M8 8 H21 V21 H8 Z M4 17 H3 V3 H17 V4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M6 11 V7 A6 6 0 0 1 18 7 V11 M5 11 H19 V22 H5 Z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9 H7 L12 5 V19 L7 15 H3 Z M16 9 Q21 12 16 15"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9 H7 L12 5 V19 L7 15 H3 Z M16 9 L21 15 M21 9 L16 15"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
</svg>

<div class="app">
  <div class="top">
    <p class="brand"><img src="assets/icon.svg" alt="" width="30" height="30">GRAVITY <span>RACE</span></p>
    <button class="icon-btn" id="sound" aria-pressed="false" aria-label="効果音"><svg class="ic"><use href="#i-mute"/></svg><span>音 OFF</span></button>
  </div>
  <nav class="levels" id="levels" aria-label="ステージ"></nav>
  <div class="head">
    <h1 id="title">どっちが速い？</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="wrap" id="wrap">
    <canvas id="stage" aria-label="レースコース"></canvas>
    <div class="clock" id="clock">0.00<small>秒</small></div>
    <div class="speed" id="speed"></div>
    <div class="slow" id="slow" hidden>SLOW ×0.15</div>
    <div class="count" id="count" hidden></div>
    <div class="guide" id="guide" hidden><img src="assets/finger-guide.svg" alt=""></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="dock" id="dock"></div>
  <div id="result" aria-live="polite"></div>
  <p class="tag">試作 v0.4 · 実寸の物理 × 3D演出 · オリジナル素材パック</p>
</div>

<script src="src/sfx.js"></script>
<script src="src/game.js"></script>
</body>
</html>
